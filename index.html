<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>札幌住宿比較 1/5–1/7（最後一站・往新千歲機場）</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#1f2a37; --sub:#5b6b7b; --line:#e3e8ee;
    --accent:#2f6fb0; --air:#0d7d6b; --pro:#1a7f46; --con:#c0392b; --star:#e8a13a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%}
  header{background:linear-gradient(135deg,#0d3a5f,#1f7d6b);color:#fff;padding:26px 18px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}
  header h1{margin:0 0 6px;font-size:1.5rem}
  header p{margin:2px 0;opacity:.93;font-size:.92rem}
  main{padding:22px 0 60px}
  .note-top{background:#eaf3ee;border:1px solid #cfe6da;color:#245c47;border-radius:10px;padding:10px 14px;font-size:.86rem;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 1px 3px rgba(20,40,70,.06);display:flex;flex-direction:column}
  .top{padding:14px 16px;border-bottom:1px solid var(--line);position:relative}
  .code{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:9px;color:#fff;background:var(--accent);
    font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center}
  .best{position:absolute;top:14px;right:56px;font-size:.68rem;background:#e2eef8;color:#1c517d;padding:2px 7px;border-radius:6px;font-weight:700}
  .name{font-weight:700;font-size:1.02rem;margin:0 44px 4px 0}
  .ward{font-size:.75rem;color:var(--sub)}
  .price{margin-top:8px;font-size:1.35rem;font-weight:800}
  .price small{font-size:.72rem;color:var(--sub);font-weight:500}
  .pp{font-size:.84rem;color:var(--sub)}
  .rate{font-size:.85rem;color:var(--star);font-weight:700;margin-top:2px}
  .air{margin:0;padding:12px 16px;background:#f0f8f6;border-bottom:1px solid var(--line)}
  .air .lbl{font-size:.72rem;color:var(--air);font-weight:700;letter-spacing:.03em}
  .air .val{font-size:.9rem;font-weight:700;margin:2px 0 6px}
  .air .est{font-size:.82rem;color:#3a4a55}
  .air a.transit{display:inline-block;margin-top:8px;text-decoration:none;background:var(--air);color:#fff;font-weight:600;font-size:.8rem;padding:6px 12px;border-radius:8px}
  .air a.transit:hover{background:#0a6355}
  .body{padding:12px 16px;font-size:.86rem;flex:1}
  .facts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .fact{background:#eef3f8;border-radius:7px;padding:3px 8px;font-size:.76rem;color:#34495e}
  .fact.park{background:#e7f5ec;color:#1a7f46}
  .fact.nopark{background:#fdeaea;color:#b23b3b}
  .layout{white-space:pre-line;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8rem;color:#33414f;margin-bottom:10px}
  .note{font-size:.8rem;color:var(--sub)}
  .foot{padding:12px 16px;border-top:1px solid var(--line)}
  .foot a.book{display:inline-block;text-decoration:none;background:var(--accent);color:#fff;font-weight:600;font-size:.84rem;padding:8px 14px;border-radius:8px}
  .foot a.book:hover{background:#155a91}
  footer{color:var(--sub);font-size:.8rem;text-align:center;padding:24px 16px 40px}
  @media(max-width:520px){.grid{grid-template-columns:1fr}header h1{font-size:1.25rem}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>札幌住宿比較 · 1/5–1/7（回程最後一站）</h1>
    <p>入住 2027/1/5 – 退房 1/7（2 晚）・5 人・3 間以上臥室</p>
    <p>重點：1/7 上午要前往新千歲機場，每張卡片都標了「到機場的距離＋大眾運輸路線與時間」</p>
  </div>
</header>
<main class="wrap">
  <div class="note-top">總價＝2 晚含稅總額（以「可免費取消」方案為準，另有更便宜的不可退款方案）；每人每晚＝總價 ÷ 10（5 人 × 2 晚）。到機場時間為概略估計，實際請點各卡片的「大眾運輸路線」查即時班次。</div>
  <div id="app"></div>
</main>
<footer>資料整理自 Booking.com（2026/7 查詢，價格與空房以官網即時為準）。到新千歲機場的路線以 Google 地圖大眾運輸模式即時規劃為準。</footer>

<script>
const data=[
{code:"A",name:"ApartmentHotel KAIDO 北22条西5丁目",ward:"札幌市北区・近地鐵北24条",addr:"北海道札幌市北区北22条西5丁目2-24",
 total:14727,pp:1473,rate:"9.3 / 10（6則）",area:"86㎡",bath:"1",park:false,
 layout:"臥1：2雙人床\n臥2：1單人+1雙人\n臥3：3日式床墊\n客廳：沙發床",
 airKm:"約 48 km",airEst:"地鐵南北線 北24条→札幌駅→JR快速エアポート，約 1 小時10分",
 note:"1/2 前可免費取消（14,727）；不可退款 13,254。市區公寓，未提供停車位。",
 url:"https://www.booking.com/hotel/jp/apartmenthotel-kaido-bei-22tiao-xi-5ding-mu.zh-tw.html"},

{code:"B",name:"The-Lila-Sapporo",ward:"札幌市中央区・近中島公園/薄野",addr:"北海道札幌市中央区南8条西10丁目1278",
 total:17792,pp:1779,rate:"10 / 10（1則）",area:"63㎡",bath:"1",park:false,best:"近市中心",
 layout:"臥1：2單人床\n臥2：2單人床\n臥3：1雙人床",
 airKm:"43 km（Booking 標示）",airEst:"地鐵 中島公園→札幌駅→JR快速エアポート，約 1 小時",
 note:"房價 14,329＋稅費 3,463＝總價約 17,792（可免費取消）；不可退款約 16,439。近薄野/中島公園，未提供停車。",
 url:"https://www.booking.com/hotel/jp/the-lila-sapporo.zh-tw.html"},

{code:"C",name:"ZABOCON Honcho Terrace",ward:"札幌市東区・本町",addr:"北海道札幌市東区本町2条1丁目14-13",
 total:11304,pp:1130,rate:"9.3 / 10（3則）",area:"81㎡",bath:"1",park:true,best:"最便宜",
 layout:"臥1：1雙人床\n臥2：2單人床\n臥3：2單人床",
 airKm:"約 45 km",airEst:"地鐵東豐線 環状通東→さっぽろ→JR快速エアポート，約 1 小時10分",
 note:"透天別墅、★含免費停車；1/7 前可免費取消。位置評分 7.5（離市中心稍遠），總價最低。",
 url:"https://www.booking.com/hotel/jp/zabocon-honcho-terrace.zh-tw.html"},

{code:"D",name:"Zabo Hills 305",ward:"札幌市中央区・薄野（豊水すすきの徒歩4分）",addr:"北海道札幌市中央区南6条東2丁目2-2",
 total:25123,pp:2512,rate:"9.5 / 10（7則）",area:"77㎡",bath:"1",park:true,best:"位置最好",
 layout:"臥1：2單人床\n臥2：2單人床\n臥3：2雙人床",
 airKm:"約 45 km",airEst:"地鐵 豊水すすきの→札幌駅→JR快速エアポート，約 1 小時",
 note:"★位置最佳（薄野核心、二条市場徒歩7分）、含免費停車；Genius 已折 20%（原 31,403→25,123，可免費取消）。價格偏高。",
 url:"https://www.booking.com/hotel/jp/zabo-hills-305.zh-tw.html"},

{code:"E",name:"SilenceWest 101",ward:"札幌市西区・八軒",addr:"北海道札幌市西区八軒7条東5丁目4-30",
 total:18238,pp:1824,rate:"10 / 10（1則）",area:"84㎡",bath:"1",park:true,
 layout:"臥1：2雙人床\n臥2：2單人床\n臥3：1單人+1雙人",
 airKm:"約 50 km",airEst:"JR八軒/琴似→札幌駅→JR快速エアポート，約 1 小時15分",
 note:"獨棟 Villa、含免費停車（僅 1 台）；1/7 前可免費取消。位置 7.5、性價比評分偏低（西区較外圍）。",
 url:"https://www.booking.com/hotel/jp/silencewest-101.zh-tw.html"},

{code:"F",name:"E-US Naebo HOUSE",ward:"札幌市東区・苗穂（JR苗穂站 1.6km）",addr:"北海道札幌市東区苗穂町3丁目1-7",
 total:20131,pp:2013,rate:"10 / 10（1則）",area:"122㎡",bath:"2",park:true,best:"最大・2衛浴",
 layout:"臥1：2單人床\n臥2：2雙人床\n臥3：2單人床\n臥4：1雙人床",
 airKm:"約 45 km",airEst:"JR苗穂→札幌駅→JR快速エアポート，約 55 分–1 小時",
 note:"★122㎡最大、4房、★2 間衛浴、含免費停車；Genius 已折 20%（原 25,164→20,131，可免費取消）。近 JR 苗穂站，往機場轉乘少。",
 url:"https://www.booking.com/hotel/jp/etrana.zh-tw.html"},
];

const fmt=n=>"$"+n.toLocaleString();
const app=document.getElementById("app");
const grid=document.createElement("div");grid.className="grid";
data.forEach(d=>{
  const transit="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(d.addr)+"&destination="+encodeURIComponent("新千歳空港")+"&travelmode=transit";
  const bookUrl=d.url+"?checkin=2027-01-05&checkout=2027-01-07&group_adults=5&no_rooms=1";
  const card=document.createElement("div");card.className="card";
  card.innerHTML=`
    <div class="top">
      <div class="code">${d.code}</div>
      ${d.best?`<div class="best">${d.best}</div>`:""}
      <div class="name">${d.name}</div>
      <div class="ward">${d.ward}</div>
      <div class="price">${fmt(d.total)} <small>/2晚(含稅)</small></div>
      <div class="pp">每人每晚 約 ${fmt(d.pp)}</div>
      <div class="rate">★ ${d.rate}</div>
    </div>
    <div class="air">
      <div class="lbl">✈ 到新千歲機場</div>
      <div class="val">${d.airKm}</div>
      <div class="est">大眾運輸：${d.airEst}</div>
      <a class="transit" href="${transit}" target="_blank" rel="noopener">查看大眾運輸路線 →</a>
    </div>
    <div class="body">
      <div class="facts">
        <span class="fact">3+房 ${d.area}</span>
        <span class="fact">衛浴 ${d.bath}</span>
        <span class="fact ${d.park?'park':'nopark'}">${d.park?'✓ 免費停車':'✗ 無停車'}</span>
      </div>
      <div class="layout">${d.layout}</div>
      <div class="note">${d.note}</div>
    </div>
    <div class="foot">
      <a class="book" href="${bookUrl}" target="_blank" rel="noopener">查看房源 →</a>
    </div>`;
  grid.appendChild(card);
});
app.appendChild(grid);
</script>
</body>
</html>
